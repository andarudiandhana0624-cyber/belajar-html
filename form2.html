<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- Label yang terhubung dengan input -->
<label for="email">Alamat Email:</label>
<input type="email" id="email" name="email" required placeholder="contoh@email.com">

<!-- Textarea -->
<label for="pesan">Pesan:</label>
<textarea id="pesan" name="pesan" rows="5" cols="40"
    placeholder="Tuliskan pesan kamu di sini..."></textarea>

<!-- Select / Dropdown -->
<label for="jurusan">Jurusan:</label>
<select id="jurusan" name="jurusan">
    <option value="pilih jurusan"></option>
    <optgroup label="Teknologi Informasi">
        <option value="">-- pilih jurusan --</option>
        <option value="rpl">Rekayasa Perangkat Lunak</option>
        <option value="tkj">Teknik Komputer Jaringan</option>
    </optgroup>
<optgroup label="Bisnis">
        <option value="ak">Akuntansi</option>
        <option value="pm">Pemasaran</option>
      </optgroup>
    </select>

<!-- fieldset & Legend -->
<fieldset>
    <legend>Data pribadi</legend>
    <label for="nama">nama:</label>
    <input type="text" id="nama" name="nama" required placeholder="Masukkan nama anda">
</fieldset>
</html>
